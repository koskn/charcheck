<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字チェック</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17221c;
      --muted: #65736b;
      --paper: #f6f7f2;
      --panel: #ffffff;
      --line: #dce4dc;
      --accent: #2e7454;
      --accent-dark: #20583e;
      --accent-soft: #e6f2e9;
      --danger: #b42338;
      --danger-soft: #fff0f1;
      --shadow: 0 20px 60px rgba(34, 62, 44, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(179, 211, 184, 0.42), transparent 25rem),
        radial-gradient(circle at 92% 88%, rgba(230, 218, 173, 0.38), transparent 24rem),
        var(--paper);
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 8vh 0 10vh;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: 0.02em;
      line-height: 1.15;
    }

    .lead {
      max-width: 38rem;
      margin: 18px 0 34px;
      color: var(--muted);
      font-size: 1rem;
    }

    .panel {
      padding: clamp(22px, 5vw, 42px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    input {
      min-width: 0;
      flex: 1;
      height: 52px;
      padding: 0 16px;
      border: 1px solid #b9c8bd;
      border-radius: 5px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(46, 116, 84, 0.14);
    }

    button {
      height: 52px;
      padding: 0 24px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      white-space: nowrap;
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgba(46, 116, 84, 0.3); outline-offset: 2px; }

    .result {
      margin-top: 24px;
      padding: 18px 20px;
      border: 1px solid;
      border-radius: 5px;
    }

    .result.ok {
      border-color: #8bc29b;
      color: #225e38;
      background: var(--accent-soft);
    }

    .result.ng {
      border-color: #e0a0aa;
      color: var(--danger);
      background: var(--danger-soft);
    }

    .result-title {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .result p { margin: 7px 0 0; }

    .bad-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .bad-list li {
      display: inline-flex;
      min-width: 2.2em;
      min-height: 2.2em;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border: 1px solid #e0a0aa;
      border-radius: 4px;
      background: #fff;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 560px) {
      main { width: min(100% - 24px, 760px); padding-top: 42px; }
      .input-row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">CHARACTER CHECK</p>
    <h1>使用できる文字を確認</h1>
    <p class="lead">多目的ラボ（仮称）の名称として応募する文字列を入力してください。日本語IMEで入力・変換しやすい文字を受け付け、絵文字や外字など使用できない文字が含まれていないか確認します。</p>

    <section class="panel" aria-labelledby="check-label">
      <form id="check-form">
        <label id="check-label" for="text-input">チェックする文字列</label>
        <div class="input-row">
          <input id="text-input" name="text" type="text" autocomplete="off" placeholder="文字列を入力してください" aria-describedby="input-help" required>
          <button type="submit">判定する</button>
        </div>
        <span id="input-help" class="sr-only">入力された文字を1文字ずつ判定します。ギリシア文字や発音記号付き文字は使用できます</span>
      </form>
      <div id="result" class="result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#check-form');
    const input = document.querySelector('#text-input');
    const result = document.querySelector('#result');

    const privateUsePattern = /[\uE000-\uF8FF\u{F0000}-\u{FFFFD}\u{100000}-\u{10FFFD}]/u;
    const pictographicPattern = /\p{Extended_Pictographic}/u;
    const widelySupportedSymbolPattern = /[©®™♀♂]/u;
    const forbiddenSymbolPattern = /[⌘﹅⁂▱⁑〻﹆]/u;
    const emojiComponentPattern = /[\u{1F3FB}-\u{1F3FF}\u{1F1E6}-\u{1F1FF}]/u;
    const controlPattern = /\p{Cc}/u;
    const joinerPattern = /[\u200C\u200D\u20E3]/u;
    const letterOrMarkPattern = /[\p{Letter}\p{Mark}]/u;
    const japaneseImeScriptPattern = /[\p{Script=Latin}\p{Script=Greek}\p{Script=Han}\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Common}\p{Script=Inherited}]/u;

    function isForbiddenCluster(cluster) {
      if (privateUsePattern.test(cluster) || emojiComponentPattern.test(cluster) || forbiddenSymbolPattern.test(cluster)) {
        return true;
      }

      for (const character of cluster) {
        if (pictographicPattern.test(character) && !widelySupportedSymbolPattern.test(character)) {
          return true;
        }
        if (controlPattern.test(character) && character !== '\n' && character !== '\r' && character !== '\t') {
          return true;
        }
        if (letterOrMarkPattern.test(character) && !japaneseImeScriptPattern.test(character)) {
          return true;
        }
      }

      return joinerPattern.test(cluster) && (pictographicPattern.test(cluster) || cluster.length > 1);
    }

    function findForbiddenCharacters(value) {
      const forbidden = [];
      const segmenter = typeof Intl.Segmenter === 'function'
        ? new Intl.Segmenter('ja', { granularity: 'grapheme' })
        : null;
      const clusters = segmenter
        ? Array.from(segmenter.segment(value), ({ segment }) => segment)
        : Array.from(value);

      for (const cluster of clusters) {
        if (isForbiddenCluster(cluster) && !forbidden.includes(cluster)) {
          forbidden.push(cluster);
        }
      }
      return forbidden;
    }

    function updateResult() {
      const forbidden = findForbiddenCharacters(input.value);
      result.hidden = false;

      if (forbidden.length === 0) {
        result.className = 'result ok';
        result.innerHTML = '<p class="result-title">〇 すべて使用可能な文字です</p><p>この文字列は送信可能です。</p>';
        return;
      }

      result.className = 'result ng';
      const list = forbidden.map((character) => `<li><code>${escapeHtml(character)}</code></li>`).join('');
      result.innerHTML = `<p class="result-title">✕ 使用できない文字が含まれています</p><p>以下の文字を取り除いてください：</p><ul class="bad-list" aria-label="使用できない文字">${list}</ul>`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      updateResult();
    });

    input.addEventListener('input', updateResult);

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }
  </script>
</body>
</html>
